<!doctype html>
<html lang="en">

<head>
  <!-- Basic Meta & Favicon -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />

  <!-- SEO Meta Tags -->
  <title>Simsha - Web Developer</title>
  <meta name="description"
    content="Portfolio of Simsha, a frontend developer skilled in React, Tailwind, and WordPress." />
  <meta name="keywords" content="Frontend Developer, React, Tailwind, Portfolio" />
  <meta name="author" content="Simsha" />
  <link rel="canonical" href="https://your-portfolio.com" />

  <!-- PWA / Manifest -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Open Graph (FB, WhatsApp, LinkedIn) -->
  <meta property="og:title" content="Simsha Portfolio" />
  <meta property="og:description" content="Frontend Developer skilled in React, Tailwind, and WordPress." />
  <meta property="og:image" content="/images/preview.png" />
  <meta property="og:url" content="https://yourdomain.com" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Structured Data (Schema.org) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Owen Prasimsha",
    "url": "https://your-portfolio.com",
    "sameAs": [
      "https://github.com/yourgithub",
      "https://linkedin.com/in/yourlinkedin"
    ],
    "jobTitle": "Front-End Developer",
    "description": "Frontend developer skilled in React, Tailwind, and WordPress",
    "worksFor": {
      "@type": "Organization",
      "name": "Freelance / Open to Work"
    }
  }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
